# Publishes a WakeUp release when the version in package.json changes on main.
#
#   node scripts/bump-version.js 2.6.0   # sets the version for both apps
#   git commit -am "WakeUp 2.6.0" && git push   (on main, or merge dev into main)
#
# A push to main whose version already has a release (tag v<version>) builds nothing. The release carries:
#   WakeUp-<v>-linux-x64.tar.gz  the desktop app as installed by scripts/install.sh (what the in-app updater uses)
#   WakeUp-<v>.AppImage          a single-file desktop app
#   WakeUp-<v>.apk               the Android app
#   SHA256SUMS                   checksums; the apps refuse any file that doesn't match
# Release notes are the commit subjects since the previous release. Run it by hand from the Actions tab to get the
# files as build artifacts without publishing.
#
# Android signing (repository secrets, Settings → Secrets and variables → Actions), from ~/.config/wakeup-signing:
#   ANDROID_KEYSTORE_BASE64  base64 of wakeup-release.jks:  base64 -w0 wakeup-release.jks
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# mobile/plugins/release-signing.js applies them. Android only installs an update signed with the same key as the
# installed app, so a release without the key fails instead of shipping an APK that can't update anyone.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          node scripts/bump-version.js --check
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then
            echo "v$V is already released."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  android:
    needs: version
    if: needs.version.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo prebuild -p android --no-install
      - name: Release signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "::error::The ANDROID_KEYSTORE_BASE64 secret is missing. Releases must be signed with WakeUp's own key."; exit 1; fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/wakeup-release.jks"
      - name: Build APK
        env:
          WAKEUP_KEYSTORE: ${{ runner.temp }}/wakeup-release.jks
          WAKEUP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WAKEUP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WAKEUP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # retried: a plugin download from the Gradle portal sometimes fails on a fresh runner
        run: |
          cd android
          for i in 1 2 3; do ./gradlew assembleRelease --no-daemon && exit 0; echo "Build attempt $i failed; retrying"; sleep 20; done
          exit 1
      - run: mv android/app/build/outputs/apk/release/app-release.apk "WakeUp-${{ needs.version.outputs.version }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: mobile/WakeUp-*.apk

  linux:
    needs: version
    if: needs.version.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --linux dir AppImage # build/icons is committed; scripts/make-icons.py only when the logo changes
      - run: tar -czf "dist/WakeUp-${{ needs.version.outputs.version }}-linux-x64.tar.gz" -C dist linux-unpacked
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.tar.gz

  release:
    needs: [version, android, linux]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums and notes
        run: |
          (cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS)
          LAST=$(git describe --tags --abbrev=0 2>/dev/null || true)
          { echo "What's new in WakeUp ${{ needs.version.outputs.version }}:"; echo;
            git log --no-merges --pretty='- %s' ${LAST:+$LAST..}HEAD | head -30; } > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: WakeUp ${{ needs.version.outputs.version }}
          body_path: notes.md
          files: out/*
