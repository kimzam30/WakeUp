<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>WakeUp</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <nav id="sidebar" aria-label="Apps">
    <div id="brand"></div>
    <div id="services"></div>
    <div class="spacer"></div>
    <div id="tools"></div>
  </nav>
  <main id="stage">
    <section id="home" aria-label="Start" hidden></section>
    <section id="settings" aria-label="Settings" hidden></section>
    <div id="dropzone" hidden></div>
  </main>
  <div id="menu" role="menu" aria-label="Layouts" hidden></div>
  <div id="downloads" role="dialog" aria-label="Downloads" hidden></div>
  <div id="ghost" hidden></div>
  <script src="find.js"></script>
  <script src="settings.js"></script>
  <script src="ui.js"></script>
</body>
</html>
